<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#161e31"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Container with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  
  <!-- Outer glowing emblem -->
  <g filter="url(#glow)">
    <rect x="86" y="86" width="340" height="340" rx="72" fill="url(#brandGrad)" opacity="0.9"/>
  </g>
  
  <!-- Inner Glass Panel -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="rgba(15, 23, 42, 0.65)"/>
  <rect x="96" y="96" width="320" height="320" rx="64" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  
  <!-- C3 Monogram Logo -->
  <text x="256" y="286" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
        font-size="140" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central"
        letter-spacing="-0.04em">C3</text>
        
  <!-- Accent Dot (Active agent indicator) -->
  <circle cx="366" cy="146" r="18" fill="#10b981"/>
  <circle cx="366" cy="146" r="26" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6"/>
</svg>
