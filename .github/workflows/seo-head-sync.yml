name: SEO head sync (temporary)

on:
  push:
    branches:
      - chore/v1-seo-release-readiness

permissions:
  contents: write

jobs:
  patch-reference-heads:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v1-seo-release-readiness

      - name: Patch canonical, social and structured metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          BASE = 'https://linkingoscar.github.io/Vanilla-Product-Experience/'

          def patch(path, lang):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if lang == 'zh':
                  desc = 'Vanilla Product Experience（VPE）的 Cursor 3.x Reference Demo：展示 Grok 4.6、多智能体工作流、真实 Liquid Glass 折射、WebGL Ambient、整站动效与响应式 Product UI。'
                  canonical = BASE
                  locale = 'zh_CN'
                  locale_alt = 'en_US'
                  langcode = 'zh-CN'
                  alternates = f'''    <link rel="canonical" href="{BASE}" />\n    <link rel="alternate" hreflang="zh-CN" href="{BASE}" />\n    <link rel="alternate" hreflang="en" href="{BASE}en/" />\n    <link rel="alternate" hreflang="x-default" href="{BASE}" />\n    <link rel="sitemap" type="application/xml" href="{BASE}sitemap.xml" />'''
              else:
                  desc = 'Cursor 3.x reference demo for Vanilla Product Experience: Grok 4.6, multi-agent workflows, real Liquid Glass refraction, WebGL ambient motion, responsive product UI.'
                  canonical = BASE + 'en/'
                  locale = 'en_US'
                  locale_alt = 'zh_CN'
                  langcode = 'en'
                  alternates = f'''    <link rel="canonical" href="{BASE}en/" />\n    <link rel="alternate" hreflang="en" href="{BASE}en/" />\n    <link rel="alternate" hreflang="zh-CN" href="{BASE}" />\n    <link rel="alternate" hreflang="x-default" href="{BASE}" />\n    <link rel="sitemap" type="application/xml" href="{BASE}sitemap.xml" />'''

              title = 'Cursor 3.x Reference Demo · Vanilla Product Experience'
              image = BASE + 'assets/icons/icon-512.png'

              s = re.sub(r'    <meta name="description" content="[^"]*" />', f'    <meta name="description" content="{desc}" />', s, count=1)
              if '<meta name="robots"' not in s:
                  s = s.replace(
                      '    <meta name="viewport" content="width=device-width, initial-scale=1" />\n',
                      '    <meta name="viewport" content="width=device-width, initial-scale=1" />\n'
                      '    <meta name="robots" content="index,follow,max-image-preview:large" />\n'
                      '    <meta name="application-name" content="Vanilla Product Experience" />\n',
                      1,
                  )

              s = re.sub(
                  r'    <!-- Multi-language Alternate -->\n(?:    <link rel="alternate"[^\n]+\n){2}',
                  '    <!-- Canonical & language alternates — TEMPLATE:EDIT when deploying a fork -->\n' + alternates + '\n',
                  s,
                  count=1,
              )

              data = {
                  '@context': 'https://schema.org',
                  '@type': 'WebPage',
                  'name': title,
                  'url': canonical,
                  'description': desc,
                  'inLanguage': langcode,
                  'isPartOf': {
                      '@type': 'WebSite',
                      'name': 'Vanilla Product Experience',
                      'url': BASE,
                  },
              }
              ld_json = json.dumps(data, ensure_ascii=False, indent=6)
              social = f'''    <!-- Open Graph / social preview -->\n    <meta property="og:type" content="website" />\n    <meta property="og:site_name" content="Vanilla Product Experience" />\n    <meta property="og:title" content="{title}" />\n    <meta property="og:description" content="{desc}" />\n    <meta property="og:url" content="{canonical}" />\n    <meta property="og:locale" content="{locale}" />\n    <meta property="og:locale:alternate" content="{locale_alt}" />\n    <meta property="og:image" content="{image}" />\n    <meta property="og:image:alt" content="Vanilla Product Experience · Cursor 3.x Reference Demo" />\n\n    <meta name="twitter:card" content="summary_large_image" />\n    <meta name="twitter:title" content="{title}" />\n    <meta name="twitter:description" content="{desc}" />\n    <meta name="twitter:image" content="{image}" />\n    <meta name="twitter:image:alt" content="Vanilla Product Experience · Cursor 3.x Reference Demo" />\n\n    <script type="application/ld+json">\n{ld_json}\n    </script>\n'''
              s = re.sub(r'    <!-- Open Graph -->\n.*?\n    <!-- Fonts -->', social + '\n    <!-- Fonts -->', s, count=1, flags=re.S)
              s = re.sub(r'    <title>[^<]*</title>', f'    <title>{title}</title>', s, count=1)
              p.write_text(s, encoding='utf-8')

          patch('index.html', 'zh')
          patch('en/index.html', 'en')
          PY

      - name: Commit patched heads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html
          if git diff --cached --quiet; then
            echo "No SEO head changes needed"
            exit 0
          fi
          git commit -m "chore(seo): align reference demo production metadata"
          git push origin HEAD:chore/v1-seo-release-readiness
