name: Visual systems static checks

on:
  push:
    branches:
      - main
      - fix/release-visual-polish
      - feat/liquid-glass-design-system
      - feat/ambient-particle-field
      - feat/site-motion-system
      - feat/product-ui-art-direction
  pull_request:
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - 'index.html'
      - 'en/index.html'
      - 'liquid-glass-lab.html'
      - 'ambient-particle-lab.html'
      - 'sw.js'
      - '.github/workflows/liquid-glass-checks.yml'

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          set -euxo pipefail
          node --check assets/js/main-base.js
          node --check assets/js/main.js
          node --check assets/js/liquid-glass.js
          node --check assets/js/liquid-glass-v2.js
          node --check assets/js/liquid-glass-components.js
          if [ -f assets/js/ambient/particle-renderer-webgl.js ]; then node --check assets/js/ambient/particle-renderer-webgl.js; fi
          if [ -f assets/js/ambient/interaction-field.js ]; then node --check assets/js/ambient/interaction-field.js; fi
          if [ -f assets/js/ambient/particle-field.js ]; then node --check assets/js/ambient/particle-field.js; fi
          if [ -f assets/js/motion/spring.js ]; then node --check assets/js/motion/spring.js; fi
          if [ -f assets/js/motion/layout-motion.js ]; then node --check assets/js/motion/layout-motion.js; fi
          if [ -f assets/js/motion/number-motion.js ]; then node --check assets/js/motion/number-motion.js; fi
          if [ -f assets/js/motion/site-motion.js ]; then node --check assets/js/motion/site-motion.js; fi
          if [ -f assets/js/product-ui.js ]; then node --check assets/js/product-ui.js; fi
          node --check sw.js

      - name: HTML IDs and inline-script syntax
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.inline_scripts = []
                  self._script_src = False
                  self._in_script = False
                  self._chunks = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'script':
                      self._in_script = True
                      self._script_src = bool(attrs.get('src'))
                      self._chunks = []

              def handle_data(self, data):
                  if self._in_script and not self._script_src:
                      self._chunks.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self._in_script:
                      if not self._script_src:
                          self.inline_scripts.append(''.join(self._chunks))
                      self._in_script = False
                      self._script_src = False
                      self._chunks = []

          files = ['index.html', 'en/index.html', 'liquid-glass-lab.html']
          if Path('ambient-particle-lab.html').exists():
              files.append('ambient-particle-lab.html')

          for filename in files:
              parser = Inspector()
              parser.feed(Path(filename).read_text(encoding='utf-8'))
              duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
              if duplicates:
                  raise SystemExit(f'{filename}: duplicate IDs: {duplicates}')
              out = Path('/tmp') / (Path(filename).stem + '-inline.js')
              out.write_text('\n;\n'.join(parser.inline_scripts), encoding='utf-8')
              print(f'{filename}: {len(parser.ids)} unique IDs, {len(parser.inline_scripts)} inline scripts')
          PY

          for file in /tmp/index-inline.js /tmp/liquid-glass-lab-inline.js /tmp/ambient-particle-lab-inline.js; do
            if [ -s "$file" ]; then node --check "$file"; fi
          done

      - name: Entrypoint dependency graph
        run: |
          set -euxo pipefail
          test -s assets/css/style-base.css
          test -s assets/css/liquid-glass.css
          test -s assets/css/liquid-glass-v2.css
          test -s assets/css/liquid-glass-components.css
          test -s assets/js/main-base.js
          test -s assets/js/liquid-glass.js
          test -s assets/js/liquid-glass-v2.js
          test -s assets/js/liquid-glass-components.js
          grep -F 'style-base.css?v=3.10.0' assets/css/style.css
          grep -F 'liquid-glass.css?v=0.1.2' assets/css/style.css
          grep -F 'liquid-glass-v2.css?v=0.2.0' assets/css/style.css
          grep -F 'liquid-glass-components.css?v=0.3.0' assets/css/style.css
          grep -F 'main-base.js?v=3.10.0' assets/js/main.js
          grep -F 'liquid-glass.js?v=0.1.3' assets/js/main.js
          grep -F 'liquid-glass-v2.js?v=0.2.1' assets/js/main.js
          grep -F 'liquid-glass-components.js?v=0.3.1' assets/js/main.js

          if [ -f assets/css/ambient-particles.css ]; then
            test -s assets/js/ambient/particle-renderer-webgl.js
            test -s assets/js/ambient/interaction-field.js
            test -s assets/js/ambient/particle-field.js
            grep -F 'ambient-particles.css?v=0.1.0' assets/css/style.css
            grep -F 'ambient/particle-field.js?v=0.1.0' assets/js/main.js
          fi

          if [ -f assets/css/site-motion.css ]; then
            test -s assets/js/motion/spring.js
            test -s assets/js/motion/layout-motion.js
            test -s assets/js/motion/number-motion.js
            test -s assets/js/motion/site-motion.js
            grep -F 'site-motion.css?v=0.1.0' assets/css/style.css
            grep -F 'motion/spring.js?v=0.1.0' assets/js/main.js
            grep -F 'motion/layout-motion.js?v=0.1.0' assets/js/main.js
            grep -F 'motion/number-motion.js?v=0.1.0' assets/js/main.js
            grep -F 'motion/site-motion.js?v=0.1.0' assets/js/main.js
          fi

          if [ -f assets/css/product-ui.css ]; then
            test -s assets/js/product-ui.js
            test -s assets/css/release-polish.css
            grep -F 'product-ui.css?v=0.1.0' assets/css/style.css
            grep -F 'product-ui.js?v=0.1.1' assets/js/main.js
            grep -F 'release-polish.css?v=0.1.0' assets/css/style.css
            grep -F 'static-landing-v8-feature-grid-011' sw.js
          elif [ -f assets/css/site-motion.css ]; then
            grep -F 'static-landing-v5-site-motion-010' sw.js
          elif [ -f assets/js/ambient/particle-field.js ]; then
            grep -F 'static-landing-v4-liquid-glass-ambient-010' sw.js
          else
            grep -F 'static-landing-v3-liquid-glass-0311' sw.js
          fi

      - name: Visual system invariants
        run: |
          set -euxo pipefail
          grep -F 'feDisplacementMap' assets/js/liquid-glass.js
          grep -F 'QUALITY === "balanced" ? 60' assets/js/liquid-glass.js
          grep -F 'lg-positioned' assets/js/liquid-glass.js
          grep -F 'protectDirectText' assets/js/liquid-glass.js
          grep -F '.lg-surface.lg-positioned' assets/css/liquid-glass.css
          grep -F 'content-copy-svg' assets/js/liquid-glass-v2.js
          grep -F 'lg-hero-controller' assets/js/liquid-glass-components.js
          grep -F 'lg-pricing-segmented' assets/js/liquid-glass-components.js
          grep -F 'lg-simulator-segmented' assets/js/liquid-glass-components.js
          grep -F 'prefers-reduced-motion' assets/css/liquid-glass.css
          grep -F 'prefers-reduced-transparency' assets/css/liquid-glass.css

          if [ -f assets/js/ambient/particle-field.js ]; then
            grep -F 'CursorAmbientField' assets/js/ambient/particle-field.js
            grep -F 'requestAnimationFrame' assets/js/ambient/particle-field.js
          fi

          if [ -f assets/js/motion/site-motion.js ]; then
            grep -F 'CursorMotionPhysics' assets/js/motion/spring.js
            grep -F 'animateFlip' assets/js/motion/layout-motion.js
            grep -F 'version: "0.1.1"' assets/js/motion/layout-motion.js
            grep -F 'naturalTarget >= startHeight' assets/js/motion/layout-motion.js
            grep -F 'cancelContainerHeight' assets/js/motion/layout-motion.js
            grep -F 'CursorNumberMotion' assets/js/motion/number-motion.js
            grep -F 'installFeatureLayoutMotion' assets/js/motion/site-motion.js
            grep -F 'installTimelineMotion' assets/js/motion/site-motion.js
            grep -F 'prefers-reduced-motion' assets/css/site-motion.css
          fi

          if [ -f assets/js/product-ui.js ]; then
            grep -F 'installMobileIa' assets/js/product-ui.js
            grep -F 'installProofStrip' assets/js/product-ui.js
            grep -F 'installEditorialBreak' assets/js/product-ui.js
            grep -F 'enhanceConversion' assets/js/product-ui.js
            grep -F 'installRoiViz' assets/js/product-ui.js
            grep -F 'CursorProductUI' assets/js/product-ui.js
            grep -F '[data-theme="light"]' assets/css/product-ui.css
            grep -F 'product-mobile-panel' assets/css/product-ui.css
            grep -F '.hero-visual { flex-direction: column' assets/css/release-polish.css
            grep -F 'feature-tabs.lg-has-shared-lens' assets/css/release-polish.css
          fi
